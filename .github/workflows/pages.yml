name: Validar e publicar PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dez-voltas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Validar contrato, API, interface e regressão
        run: npm test

  deploy:
    name: Publicar no Cloudflare Pages
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: '322701de6692512e8effd071b6519470'
    steps:
      - name: Conferir credencial de publicação
        id: credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Publicação não executada: cadastre CLOUDFLARE_API_TOKEN nos Secrets do GitHub e execute este workflow novamente.'
            echo '### Publicação pendente' >> "$GITHUB_STEP_SUMMARY"
            echo 'Os testes passaram. Para publicar, cadastre o Secret CLOUDFLARE_API_TOKEN em Settings → Secrets and variables → Actions e execute Run workflow novamente. O site atual não foi alterado.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.credentials.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.credentials.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Publicar PWA e API no projeto existente
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.152.0'
          command: pages deploy dist --project-name dez-voltas --branch main
